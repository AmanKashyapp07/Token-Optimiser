services:
  gateway:
    build: .
    container_name: token-optimiser-gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_PATH=/app/backend/data/app.db
      - REDIS_URL=redis://redis:6379/0
      - SEMANTIC_THRESHOLD=0.55
      - CACHE_TTL_SECONDS=86400
    volumes:
      - gateway-data:/app/backend/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: token-optimiser-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  gateway-data:
  redis-data:
