[pytest]
testpaths = backend/tests
pythonpath = backend/src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
norecursedirs = backend/scripts/reference node_modules dist .venv .git
addopts = --ignore=backend/tests/test_compression_application_validation.py --ignore=backend/tests/test_compression_phrases.py
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    unit: Fast unit tests with zero network or I/O dependencies
    integration: Feature API and database persistence integration tests
    e2e: End-to-end OpenAI-compatible proxy and pipeline tests
    resilience: Chaos, singleflight, circuit breaker, and concurrency tests
    benchmark: Latency and throughput benchmarking tests
